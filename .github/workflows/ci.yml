name: Equipment Inventory CI

on:
  push:
    branches:
      - main
    tags:
      - "*"

  pull_request:
    branches:
      - main

  workflow_dispatch:

jobs:
  validate:
    if: github.ref == 'refs/heads/main' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    container: python:3.12.7-slim

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show Python version and commit
        run: |
          python --version
          echo "Commit: $GITHUB_SHA"

      - name: Check Python syntax
        run: python -m compileall -q .

      - name: Check Docker files
        run: |
          test -f Dockerfile
          test -f .dockerignore
    
      - name: Check APP_PORT
        env:
          APP_PORT: ${{ vars.APP_PORT }}
        run: |
          test "$APP_PORT" = "8105"
          echo "APP_PORT is configured"

      - name: Check DEPLOY_TOKEN
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        run: |
          test -n "$DEPLOY_TOKEN"
          echo "DEPLOY_TOKEN is configured"

  test:
    needs: validate
    runs-on: ubuntu-latest
    container: python:3.12.7-slim

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

  package:
    needs: test
    if: |
      always() &&
      github.event_name == 'push' &&
      (github.ref_type == 'branch' || github.ref_type == 'tag') &&
      (needs.test.result == 'success' || 
       (github.ref_type == 'tag' && needs.test.result == 'skipped'))
    runs-on: ubuntu-latest
    container: python:3.12.7-slim

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create distribution
        run: |
          mkdir -p dist

          cp inventory.py README.md Dockerfile inventory.json.example dist/

          {
            echo "CI_COMMIT_SHA=$GITHUB_SHA"
            echo "CI_PIPELINE_ID=$GITHUB_RUN_ID"
            echo "Files:"
            find dist -maxdepth 1 -type f ! -name manifest.txt -printf '%f\n' | sort
          } > dist/manifest.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: equipment-inventory
          path: dist/
          retention-days: ${{ startsWith(github.ref, 'refs/tags/rc-') && 2 || 7 }}

  deploy_test:
    if: |
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main'
    needs: [validate, test]
    runs-on: ubuntu-24.04
    container: python:3.12.7-slim

    steps:
      - name: Check deployment token
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
          APP_PORT: ${{ vars.APP_PORT }}
        run: |
          test -n "$DEPLOY_TOKEN"
          test "$APP_PORT" = "8105"
          echo "Deployment configuration is valid"

      - name: Deployment placeholder
        run: echo "Manual deployment is ready"
